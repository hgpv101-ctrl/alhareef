workflows:
  android-apk:
    name: Hareef Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate android folder
        script: |
          flutter create . --platforms=android --org com.hareef --project-name hareef_app
          M=android/app/src/main/AndroidManifest.xml
          perl -pi -e 's#android:label="[^"]*"#android:label="الحريف المدير الذكي"#' $M
          Q='<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>'
          if grep -q '<queries>' $M; then
            Q="$Q" perl -pi -e 's#<queries>#<queries>$ENV{Q}#' $M
          else
            Q="$Q" perl -pi -e 's#<application#<queries>$ENV{Q}</queries><application#' $M
          fi
      - name: Add INTERNET + LOCATION permissions (الإنترنت لفحص الوقت، والموقع لتحديد مكان العميل)
        script: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || perl -pi -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/><application#' $M
          grep -q 'android.permission.ACCESS_FINE_LOCATION' $M || perl -pi -e 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' $M
      - name: App integrity (فحص توقيع التطبيق من الجزء الأصلي)
        script: |
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          [ -n "$F" ] || { echo "MainActivity.kt not found"; exit 1; }
          PKG=$(grep -m1 '^package ' "$F")
          sed "s#@@PACKAGE@@#$PKG#" tool/MainActivity.kt.tpl > "$F"
      - name: Fixed signing key (مفتاح توقيع ثابت عشان التحديثات تنزل فوق النسخة القديمة)
        script: |
          mkdir -p $HOME/.android
          cp tool/hareef_debug.keystore $HOME/.android/debug.keystore
          cp tool/hareef_debug.keystore android/app/hareef_debug.keystore
          if [ -f android/app/build.gradle.kts ]; then
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("hareef_debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("hareef_debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          else echo "app build.gradle not found"; exit 1; fi
      - name: Force compileSdk 36 for plugins
        script: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (project.name != "app") {
                  val applyFix: Project.() -> Unit = {
                      extensions.findByName("android")?.withGroovyBuilder { setProperty("compileSdk", 36) }
                  }
                  if (project.state.executed) { project.applyFix() } else { project.afterEvaluate { project.applyFix() } }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
          cat >> android/build.gradle <<'EOF'

          subprojects {
              if (project.name != "app") {
                  afterEvaluate {
                      if (project.extensions.findByName("android") != null) {
                          project.android.compileSdk = 36
                      }
                  }
              }
          }
          EOF
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze (مش بتوقف البناء — بيطلّع أي أخطاء في اللوج)
        script: flutter analyze --no-fatal-infos --no-fatal-warnings || echo "راجع تحليل الكود في اللوج"
      - name: Run tests (مش بتوقف البناء)
        script: flutter test || echo "بعض الاختبارات فشلت — راجع اللوج"
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || echo "icons skipped"
      - name: Build APK
        script: flutter build apk --release --obfuscate --split-debug-info=build/symbols
      - name: Verify APK signature (لو التوقيع مش بمفتاحك الـ APK مايطلعش — عشان ما يتقفلش عند المستخدم)
        script: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found — skipping check"; exit 0; }
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          GOT=$(grep -i 'certificate SHA-256 digest' /tmp/certs.txt | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          WANT=$(grep -o "'[0-9a-f]\{64\}'" lib/data/integrity.dart | tr -d "'")
          echo "APK=$GOT"; echo "EXPECTED=$WANT"
          [ "$GOT" = "$WANT" ] || { echo "SIGNATURE MISMATCH — الـ APK موقّع بمفتاح غير المتوقع"; exit 1; }
    artifacts:
      - build/**/outputs/**/*.apk
