name: hareef_app
description: الحريف المدير الذكي - إدارة المبيعات والتقسيط
publish_to: none
version: 1.9.10+27
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: any
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  excel: ^4.0.6
  ed25519_edwards: ^0.3.1
  android_id: ^0.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: DejaVu
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
